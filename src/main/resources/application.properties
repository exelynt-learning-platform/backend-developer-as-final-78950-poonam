# ==========================================
# APPLICATION
# ==========================================

spring.application.name=ResourceBookingSystem

server.port=8080


# ==========================================
# DATABASE (In-Memory with MySQL Compatibility Mode for Zero-Setup CI/CD & Cloud Runners)
# ==========================================

spring.datasource.url=jdbc:h2:mem:bookingsystem;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# ==========================================
# JWT
# ==========================================

jwt.secret=ResourceBookingSystemSecretKey2026VerySecureKey123456789

jwt.expiration=86400000


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html